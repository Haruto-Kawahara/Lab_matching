<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>研究室配属支援システム</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>研究室一覧</h1>
        <div id="labList"></div>
        <hr>
        <div id="detailArea">
            研究室を選択してください
        </div>

        <h3>タグ一覧</h3>
        <div id="tagArea">
        </div>

        <section id="dianosis">
            <h4>あなたに合う研究室診断はこちら</h4>
            <h5 id="question"></h5>
            <div id="buttons">
                <button onclick="answer('yes')">YES</button>
                <button onclick="answer('no')">NO</button>
            </div>
            <div id="result"></div>
            <button id="restartBtn" style="display: none;">
                もう一度診断する
            </button>
            
        </section>
        <script src="js/app.js"></script>
    </body>
</html>
